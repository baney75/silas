[package]
name = "polycarp-voice"
version = "0.1.6"
description = "Silas voice engine: hold a key, speak, and it types what you said. No UI toolkit."
authors = ["Donovan Baney"]
license = "MIT"
edition = "2021"

[lib]
name = "polycarp_voice"

[[bin]]
name = "silas-bench"
path = "src/bin/silas-bench.rs"
required-features = ["bench"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
handy-keys = "0.3.4"
cpal = "0.16"
rphonetic = "4"
dirs = "6"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
ureq = "3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# Parakeet v3 (the default model) runs in process on transcribe.cpp. CPU build on every platform, no
# Metal: the engine the model study scored (bench/models/accent-2026-11.md). Builds transcribe.cpp and
# ggml from vendored source, so it needs CMake and a C++ compiler; see .cargo/config.toml for the CPU floor.
transcribe-cpp = { version = "=0.4.2", default-features = false }
chacha20poly1305 = "0.10"
hkdf = "0.12"
data-encoding = "2"
unicode-normalization = "0.1"
getrandom = "0.3"
zeroize = "1"
mdns-sd = "0.22.0"
notify = "8"

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }
libc = "0.2"
x11rb = { version = "0.13", features = ["xkb", "xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
keyring = { version = "3", features = ["apple-native"] }

[features]
bench = []
# Kept so older commands still build: GGUF models need no extra feature now.
gguf = ["bench"]

# The TDT decoder fix for the ONNX fallback (vendor/transcribe-rs/VENDORED.md).
[patch.crates-io]
transcribe-rs = { path = "../../vendor/transcribe-rs" }

[dev-dependencies]
env_logger = "0.11"
