name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # Rust 1.100 moved build scripts' OUT_DIR one folder deeper. ort-sys 2.0.0-rc.13 finds the
      # target dir from it and panics copying DirectML.dll on Windows; rc.14 fixes that, but
      # transcribe-rs 0.3.12 doesn't build against rc.14. Drop the pin when transcribe-rs moves.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ matrix.os == 'windows-latest' && '1.99.1' || 'stable' }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            core/voice
          key: ${{ matrix.os }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev libxdo-dev
      - name: Release requirement pin
        if: runner.os == 'Linux'
        run: scripts/check-requirement.sh --pin && scripts/check-requirement-test.sh && bash scripts/signing-identity-test.sh && bash scripts/install-requirement-test.sh
      - name: Release channel rules
        if: runner.os == 'Linux'
        run: scripts/check-channels.sh && scripts/check-channels-test.sh && scripts/channel-version-test.sh
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:theme
      - name: Theme unit tests
        run: bun test
      - name: Voice engine tests
        working-directory: core/voice
        run: cargo test
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Lint
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
