name: Nightly
# Rebuilds the rolling `nightly` pre-release for macOS, Windows and Linux at 07:00 UTC when `main`
# changed. The build itself is channel-build.yml, shared with dev.yml and promote.yml; see it and
# docs/channels.md. Nothing built here can reach stable users: stable updates are signed on the
# release Mac with a different key.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  nightly:
    uses: ./.github/workflows/channel-build.yml
    with:
      channel: nightly
    secrets: inherit
