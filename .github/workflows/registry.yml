name: Device registry
# Device reports arrive as issues from Silas's "Share results" (label device-report).
#   1. On open, and again on every edit, the report is validated and the issue gets a comment.
#      An edit also removes any approval, so a maintainer always approves the body that was
#      checked. Nothing is written.
#   2. A maintainer adds the `registry-approved` label (only people with triage or higher
#      access can label). The report is validated again, stored as registry/reports/<n>.json,
#      devices.json is rebuilt, both are committed to main, and the issue is closed.
# The issue body is untrusted: it reaches ingest.py only through an environment variable and
# is parsed as JSON there, never interpolated into a shell line. No bot PRs: the repo doesn't
# let Actions open them, and a label is the maintainer's review.
on:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    paths: [registry/**, .github/workflows/registry.yml]
  push:
    branches: [main]
    paths: [registry/reports/**, registry/devices.json]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: python3 -I registry/test_ingest.py
      # Hand-made report files fail here, before anyone merges them.
      - run: python3 -I registry/ingest.py --verify

  check:
    if: >-
      github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'device-report') &&
      (github.event.action == 'opened' || github.event.action == 'edited')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main, persist-credentials: false }
      - name: Validate and comment
        run: |
          set +e
          python3 -I registry/ingest.py --check > "$RUNNER_TEMP/result.txt"
          code=$?
          set -e
          case $code in
          0) cp "$RUNNER_TEMP/result.txt" "$RUNNER_TEMP/comment.md" ;;
          2) { echo "Silas couldn't use this report:"; echo; cat "$RUNNER_TEMP/result.txt"; } > "$RUNNER_TEMP/comment.md" ;;
          *) exit 1 ;;
          esac
          if [ "${{ github.event.action }}" = edited ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label registry-approved >/dev/null 2>&1 || true
            printf '\n\nThe report changed, so it needs a fresh approval.\n' >> "$RUNNER_TEMP/comment.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"

  approve:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'registry-approved' && contains(github.event.issue.labels.*.name, 'device-report')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    # One group per issue, so approving several reports at once never drops a pending run;
    # the fetch/reset/retry loop below handles their pushes racing each other.
    concurrency:
      group: registry-approve-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      SENDER: ${{ github.event.sender.login }}
    steps:
      - name: Only maintainers approve
        run: |
          perm=$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" -q .permission)
          case "$perm" in admin | maintain | write) ;; *) echo "$SENDER has $perm access" >&2; exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - name: Store, rebuild and push, retrying if main moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            set +e
            python3 -I registry/ingest.py > "$RUNNER_TEMP/result.txt"
            code=$?
            set -e
            if [ "$code" = 2 ]; then
              { echo "Silas couldn't use this report:"; echo; cat "$RUNNER_TEMP/result.txt"; } > "$RUNNER_TEMP/comment.md"
              gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
              exit 1
            fi
            [ "$code" = 0 ] || exit 1
            git add registry/reports registry/devices.json
            if git diff --cached --quiet; then
              echo "Already in the registry." > "$RUNNER_TEMP/result.txt"
              break
            fi
            git commit -q -m "Device report from #$ISSUE_NUMBER"
            if git push -q origin HEAD:main; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 5))
          done
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/result.txt"
          gh issue close "$ISSUE_NUMBER"

  rebuild:
    # A maintainer changed reports or devices.json by hand on main. A newer pending rebuild
    # replacing an older one loses nothing: each rebuilds from all of main.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: registry-rebuild
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - name: Rebuild devices.json from main and push, retrying if main moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -I registry/ingest.py --rebuild
            if git diff --quiet registry/devices.json; then exit 0; fi
            git commit -q -am "Rebuild device registry"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
