name: Device registry
# Device reports arrive as issues (from Silas's "Share results"). Each valid report becomes a
# PR that adds registry/reports/<issue>.json; a maintainer merges it; then devices.json is
# rebuilt on main. The issue body is untrusted: it reaches the script only through an
# environment variable and is parsed as JSON there, never interpolated into a shell line.
on:
  # Not `edited`: a report that changes after its PR was reviewed must not slip into that PR.
  issues:
    types: [opened, labeled]
  pull_request:
    paths: [registry/**, .github/workflows/registry.yml]
  push:
    branches: [main]
    paths: [registry/reports/**]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: python3 -I registry/test_ingest.py

  report:
    if: >-
      github.event_name == 'issues' && github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'device-report') &&
      (github.event.action == 'opened' || github.event.label.name == 'device-report')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: registry-report-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - name: Validate and store
        id: ingest
        run: |
          set +e
          python3 -I registry/ingest.py > "$RUNNER_TEMP/result.txt"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/result.txt"
      - name: Reject
        if: steps.ingest.outputs.code == '2'
        run: |
          { echo "Silas couldn't use this report:"; echo; cat "$RUNNER_TEMP/result.txt"; } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
      # Report PRs are opened with GITHUB_TOKEN, so CI doesn't run on them; the validation
      # above is the check, and the PR adds only the one validated data file.
      - name: Open the report PR
        if: steps.ingest.outputs.code == '0'
        run: |
          branch="registry/report-$ISSUE_NUMBER"
          # One PR per issue, never rewritten after it opens.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A PR for #$ISSUE_NUMBER already exists; leaving it as reviewed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "registry/reports/$ISSUE_NUMBER.json"
          if git diff --cached --quiet; then
            echo "This report is already in the registry."
            exit 0
          fi
          git commit -q -m "Device report from #$ISSUE_NUMBER"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "Device report from #$ISSUE_NUMBER" \
            --body "Adds the validated report from #$ISSUE_NUMBER. Merging rebuilds registry/devices.json on main."
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/result.txt"
      - name: Script error
        if: steps.ingest.outputs.code != '0' && steps.ingest.outputs.code != '2'
        run: exit 1

  rebuild:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: registry-rebuild
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - name: Rebuild devices.json from main and push, retrying if main moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 -I registry/ingest.py --rebuild
            if git diff --quiet registry/devices.json; then exit 0; fi
            git commit -q -am "Rebuild device registry"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
