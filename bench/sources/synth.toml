# Synthesized clips for bench set v1: dictation, code, command and longform documents.
#
# say        What the speaker says. ref_verbatim is derived from it (lowercase, punctuation
#            dropped, hyphens split). Punctuation here only shapes TTS pauses and intonation.
#            Numbers are always written as the words spoken.
# formatted  ref_formatted: what an excellent dictation app should type. Written by hand.
#            For command clips it is a JSON action list (see bench/README.md).
# notes      Optional note copied to the manifest.
#
# [respell] maps a spoken token to the spelling Kokoro needs to pronounce it right. It changes
# only the TTS input, never ref_verbatim.

[respell]
"A M" = "ay em"
"onnx" = "on icks"

