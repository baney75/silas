id = "longform-0010"
notes = "personal letter; fillers and self-corrections; no spoken punctuation"
say = """Dear Tom, it has been far too long since I wrote, and I'm sorry about that. The last few months have been, um, a lot, but mostly in good ways. We finally sold the old house in August. It took almost four months, which felt like forever, but the family who bought it has three little kids, and the oldest one asked if she could keep the swing in the backyard, so I think it went to the right people. We moved into the new place on Labor Day weekend. It's smaller, about twelve hundred square feet, but it's ten minutes from the hospital where Ellen works, so she gets an extra hour a day back. That alone has been worth it. The garden is a mess right now, uh, mostly weeds and one very determined rosebush, but I have big plans for the spring. Work has been steady. I'm still at the print shop three days a week, no, four now, since they lost one of the morning people. I don't mind. I like the quiet before the shop opens, and I've gotten pretty good at fixing the old press when it jams, which is about twice a week. The owner keeps saying he'll replace it next year, and I keep saying I'll believe it when I see it. How is your father doing? The last I heard, he was recovering from the knee surgery and driving your mother crazy by trying to mow the lawn too early. I hope he has, um, slowed down a little. Please tell him we have been praying for him and that the offer to come fishing still stands, whenever the doctor says he can sit in a boat for a whole morning. We are planning to drive up to see Ellen's sister the week after Thanksgiving, and your town is right on the way. Would you have time for lunch on Saturday the twenty ninth, or, actually, Sunday the thirtieth might be easier, since we will be heading home that day anyway? Let me know what works for you. You can reach me at the same number as always, or email me at walt dot becker at example dot net if that is easier. Take care of yourself, and give my best to Anna and the boys. Your friend, Walt."""
