[[item]]
id = "longform-0006"
notes = "long email; no spoken punctuation"
say = """Hi team, I wanted to put everything about next month's launch in one place so nobody has to dig through the chat history. First, the date. We are planning to ship version two point oh on Tuesday, March eleventh, assuming the release candidate passes testing by the end of next week. If it doesn't, we will slip by exactly one week rather than trying to squeeze fixes in at the last minute. Second, the scope. The headline feature is offline mode, which lets people keep working when their connection drops and syncs everything once they are back online. We are also shipping the new onboarding flow that Maya's group has been testing with customers since January. The early numbers look good. Completion went from about sixty one percent to just over eighty percent, and support tickets about account setup dropped by almost half. Third, the work that is not making it. The calendar integration is being pushed to the next release. It is close, but the sync logic still loses events when two people edit the same meeting at once, and I would rather ship it late than ship it broken. Please don't promise it to customers yet. Now for the schedule over the next three weeks. Engineering freezes features this Friday. From then on, only bug fixes go into the release branch, and every fix needs a second reviewer. Quality assurance runs the full regression suite on Monday and Wednesday, and Daniel will post the results in the release channel by five P M each day. Marketing needs final screenshots by March fourth, so if you own a screen that is still changing, tell Rebecca today. On the support side, we are adding two temporary contractors for the first two weeks after launch. They start on March tenth and will handle the first line of tickets so the core team can focus on anything urgent. The budget for that is about eight thousand five hundred dollars, which finance has already approved. A few things I need from each of you. Please review the launch checklist in the shared drive and add anything I missed. Update your tickets so the board reflects reality, especially anything marked in progress that has actually been sitting idle. And if you are planning time off in March, let me know by Thursday so we can cover your areas. I know this has been a long push, and I really appreciate how carefully everyone has worked through it. Let's finish strong. Thanks, Alex."""
formatted = """Hi team, I wanted to put everything about next month's launch in one place so nobody has to dig through the chat history. First, the date. We are planning to ship version 2.0 on Tuesday, March 11, assuming the release candidate passes testing by the end of next week. If it doesn't, we will slip by exactly one week rather than trying to squeeze fixes in at the last minute. Second, the scope. The headline feature is offline mode, which lets people keep working when their connection drops and syncs everything once they are back online. We are also shipping the new onboarding flow that Maya's group has been testing with customers since January. The early numbers look good. Completion went from about 61% to just over 80%, and support tickets about account setup dropped by almost half. Third, the work that is not making it. The calendar integration is being pushed to the next release. It is close, but the sync logic still loses events when two people edit the same meeting at once, and I would rather ship it late than ship it broken. Please don't promise it to customers yet. Now for the schedule over the next three weeks. Engineering freezes features this Friday. From then on, only bug fixes go into the release branch, and every fix needs a second reviewer. Quality assurance runs the full regression suite on Monday and Wednesday, and Daniel will post the results in the release channel by 5 PM each day. Marketing needs final screenshots by March 4, so if you own a screen that is still changing, tell Rebecca today. On the support side, we are adding two temporary contractors for the first two weeks after launch. They start on March 10 and will handle the first line of tickets so the core team can focus on anything urgent. The budget for that is about $8,500, which finance has already approved. A few things I need from each of you. Please review the launch checklist in the shared drive and add anything I missed. Update your tickets so the board reflects reality, especially anything marked in progress that has actually been sitting idle. And if you are planning time off in March, let me know by Thursday so we can cover your areas. I know this has been a long push, and I really appreciate how carefully everyone has worked through it. Let's finish strong. Thanks, Alex."""

[[item]]
id = "longform-0007"
notes = "meeting notes; spoken punctuation throughout"
say = """Meeting notes colon, design review comma, Thursday November thirteenth. New paragraph. Attendees colon, Sarah comma, Kevin comma, Luis comma, and Priya period. New paragraph. First topic colon, the settings page period. Kevin showed the new layout comma, and everyone agreed it is much easier to scan period. Sarah wants the advanced options collapsed by default comma, because most people never touch them period. Luis pointed out that the toggle labels are still too long on small screens period. New paragraph. Second topic colon, onboarding period. Priya ran five user sessions last week period. Three of the five people missed the microphone permission prompt entirely comma, so we are going to add a short explanation before the system dialog appears period. Nobody had trouble with the hotkey setup comma, which is a nice change from last time period. New paragraph. Third topic colon, accessibility period. Sarah ran the screen reader over every screen comma, and the only real problem was the waveform overlay comma, which announces itself every time it updates period. Kevin will hide it from screen readers and add a single label instead period. New paragraph. Fourth topic colon, the release date period. We agreed to hold the date of December second as long as the crash on wake is fixed by Monday period. If it is not comma, we move to December ninth and tell the beta group right away period. New paragraph. Action items colon. New line. Kevin to shorten the toggle labels by Friday period. New line. Kevin to hide the waveform overlay from screen readers period. New line. Priya to draft the permission explanation and share it in the design channel period. New line. Luis to confirm the crash fix with a clean install on an older laptop period. New line. Sarah to send these notes to the wider team period. New paragraph. The next review is Thursday at two P M in the small conference room period."""
formatted = """Meeting notes: design review, Thursday, November 13

Attendees: Sarah, Kevin, Luis, and Priya.

First topic: the settings page. Kevin showed the new layout, and everyone agreed it is much easier to scan. Sarah wants the advanced options collapsed by default, because most people never touch them. Luis pointed out that the toggle labels are still too long on small screens.

Second topic: onboarding. Priya ran five user sessions last week. Three of the five people missed the microphone permission prompt entirely, so we are going to add a short explanation before the system dialog appears. Nobody had trouble with the hotkey setup, which is a nice change from last time.

Third topic: accessibility. Sarah ran the screen reader over every screen, and the only real problem was the waveform overlay, which announces itself every time it updates. Kevin will hide it from screen readers and add a single label instead.

Fourth topic: the release date. We agreed to hold the date of December 2 as long as the crash on wake is fixed by Monday. If it is not, we move to December 9 and tell the beta group right away.

Action items:
Kevin to shorten the toggle labels by Friday.
Kevin to hide the waveform overlay from screen readers.
Priya to draft the permission explanation and share it in the design channel.
Luis to confirm the crash fix with a clean install on an older laptop.
Sarah to send these notes to the wider team.

The next review is Thursday at 2 PM in the small conference room."""

[[item]]
id = "longform-0008"
notes = "short essay; no spoken punctuation"
say = """When I was eleven, the public library in our town moved into an old hardware store on the main street. The building still had the wide wooden floors and the tall front windows, and for years you could see faint outlines on the walls where the shelves of paint and nails had been. I spent most of my summers there. Looking back, that small library taught me more about learning than any classroom I sat in. The first lesson was that curiosity needs room to wander. The library had no computer catalog for most of the time I went there. If you wanted a book about birds, you walked to the five hundreds and started reading spines. Half the time you left with something else entirely, a history of lighthouses or a book about how bridges are built, because it happened to sit on the shelf next to the one you wanted. That kind of accident is harder to come by now. Search is fast and precise, and it gives us exactly what we ask for, which means it rarely gives us what we didn't know to ask for. The second lesson was that patience is a skill, not a personality trait. The library allowed three books per visit, and interlibrary loans took two or three weeks to arrive. You learned to plan, to read slowly, and to finish what you started, because the next book was not going to appear the moment you got bored. I don't think we should go back to waiting weeks for a book, but I do think we lose something when nothing in our lives asks us to wait. The third lesson came from the librarian, a retired science teacher named Missus Delgado. She never told me what to read. Instead, she asked what I had liked about the last book and handed me two more that shared that one quality, whether it was a stubborn main character or a story told out of order. She was teaching me to notice why I liked things, which turned out to be the beginning of thinking clearly about almost anything. The library moved again about ten years ago into a modern building with skylights and a coffee counter. It is a better library by almost every measure. It has more books, longer hours, and a room full of computers that are rarely empty. Still, when I visit, I find myself walking the shelves instead of using the catalog, waiting to be surprised by whatever happens to be sitting next to the book I came for."""
formatted = """When I was 11, the public library in our town moved into an old hardware store on the main street. The building still had the wide wooden floors and the tall front windows, and for years you could see faint outlines on the walls where the shelves of paint and nails had been. I spent most of my summers there. Looking back, that small library taught me more about learning than any classroom I sat in. The first lesson was that curiosity needs room to wander. The library had no computer catalog for most of the time I went there. If you wanted a book about birds, you walked to the 500s and started reading spines. Half the time you left with something else entirely, a history of lighthouses or a book about how bridges are built, because it happened to sit on the shelf next to the one you wanted. That kind of accident is harder to come by now. Search is fast and precise, and it gives us exactly what we ask for, which means it rarely gives us what we didn't know to ask for. The second lesson was that patience is a skill, not a personality trait. The library allowed three books per visit, and interlibrary loans took two or three weeks to arrive. You learned to plan, to read slowly, and to finish what you started, because the next book was not going to appear the moment you got bored. I don't think we should go back to waiting weeks for a book, but I do think we lose something when nothing in our lives asks us to wait. The third lesson came from the librarian, a retired science teacher named Mrs. Delgado. She never told me what to read. Instead, she asked what I had liked about the last book and handed me two more that shared that one quality, whether it was a stubborn main character or a story told out of order. She was teaching me to notice why I liked things, which turned out to be the beginning of thinking clearly about almost anything. The library moved again about 10 years ago into a modern building with skylights and a coffee counter. It is a better library by almost every measure. It has more books, longer hours, and a room full of computers that are rarely empty. Still, when I visit, I find myself walking the shelves instead of using the catalog, waiting to be surprised by whatever happens to be sitting next to the book I came for."""

